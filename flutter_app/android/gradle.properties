# JVM settings for the Android build. The Flutter template defaults to -Xmx8G,
# which fails on machines with limited RAM; 4G is enough for this module and is
# friendlier for the demo laptops used during the competition.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin 2.4 incremental compilation intermittently aborts on Windows while
# compiling plugin modules with "Could not close incremental caches" /
# "Storage ... is already registered" (seen on :share_plus). Building without
# it is reproducible; the only cost is a slightly slower incremental build.
kotlin.incremental=false
